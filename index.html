<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Treino Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:400,500,600,700|jetbrains-mono:500" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0f;
      --bg-elevated: #0e1117;
      --surface: #12151c;
      --surface2: #1a1e28;
      --surface3: #222733;
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.12);
      --text: #f1f3f7;
      --text-secondary: #9aa3b5;
      --accent: #34d399;
      --accent-dim: #059669;
      --accent-glow: rgba(52,211,153,0.18);
      --accent-text: #041510;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.1);
      --success: #34d399;
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 18px;
      --nav-h: 72px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --shadow: 0 8px 32px rgba(0,0,0,0.35);
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="light"] {
      --bg: #f4f6fa;
      --bg-elevated: #eef1f6;
      --surface: #ffffff;
      --surface2: #f0f3f8;
      --surface3: #e4e9f2;
      --border: rgba(15,23,42,0.08);
      --border-strong: rgba(15,23,42,0.14);
      --text: #0f172a;
      --text-secondary: #64748b;
      --accent: #059669;
      --accent-dim: #047857;
      --accent-glow: rgba(5,150,105,0.12);
      --accent-text: #ffffff;
      --danger-bg: rgba(239,68,68,0.08);
      --shadow: 0 8px 32px rgba(15,23,42,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-glow), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(52,211,153,0.04), transparent);
      pointer-events: none;
      z-index: 0;
    }
    #app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding-top: var(--safe-t);
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
    }
    .screen {
      display: none;
      padding: 20px 18px;
      animation: fadeIn 0.35s var(--ease);
    }
    .screen.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .screen { animation: none; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
    .page-header { margin-bottom: 20px; }
    .page-header h1 {
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .session-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s var(--ease);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-title {
      font-weight: 600;
      font-size: 0.9375rem;
      line-height: 1.35;
      flex: 1;
      letter-spacing: -0.01em;
    }
    .badge {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--surface2);
      color: var(--text-secondary);
      white-space: nowrap;
      font-family: var(--mono);
    }
    .badge.accent {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(52,211,153,0.2);
    }
    .last-session {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-bottom: 14px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
    }
    .last-session svg { flex-shrink: 0; opacity: 0.6; }
    .sets-grid { display: flex; flex-direction: column; gap: 8px; }
    .set-row {
      display: grid;
      grid-template-columns: 36px 1fr 1fr;
      gap: 8px;
      align-items: end;
    }
    .set-row--bw { grid-template-columns: 36px 1fr; }
    .set-num {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--text-secondary);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .field label {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, select, textarea {
      font-family: var(--font);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 11px 12px;
      font-size: 1rem;
      width: 100%;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input[type="number"] { font-family: var(--mono); font-weight: 500; -moz-appearance: textfield; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; }
    select { cursor: pointer; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s var(--ease), opacity 0.15s, background 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-primary:active { box-shadow: 0 2px 8px var(--accent-glow); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(248,113,113,0.2); }
    .btn-sm { padding: 8px 14px; font-size: 0.8125rem; }
    .btn-block { width: 100%; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .day-picker-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .day-picker-wrap::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 4px;
      width: 32px;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }
    .day-picker {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .day-picker::-webkit-scrollbar { display: none; }
    .day-chip {
      flex-shrink: 0;
      padding: 10px 16px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s var(--ease);
    }
    .day-chip:active { transform: scale(0.97); }
    .day-chip.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 700;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(18,21,28,0.82);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
    }
    [data-theme="light"] nav { background: rgba(255,255,255,0.88); }
    @media (prefers-reduced-transparency: reduce) {
      nav { background: var(--surface); backdrop-filter: none; }
    }
    nav button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      padding: 10px 4px;
      transition: color 0.2s var(--ease);
      position: relative;
    }
    nav button.active { color: var(--accent); }
    nav button.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background: var(--accent);
      border-radius: 0 0 2px 2px;
    }
    nav button svg { width: 22px; height: 22px; stroke-width: 1.75; }
    .plan-day {
      margin-bottom: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .plan-day-title {
      font-weight: 700;
      font-size: 0.9375rem;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .plan-day-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .exercise-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .exercise-item:last-child { border-bottom: none; }
    .exercise-info { flex: 1; min-width: 0; }
    .exercise-name { font-size: 0.875rem; font-weight: 600; line-height: 1.35; }
    .exercise-meta { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; font-family: var(--mono); }
    .exercise-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.15s var(--ease);
    }
    .icon-btn:active:not(:disabled) { transform: scale(0.93); background: var(--surface3); }
    .icon-btn:disabled { opacity: 0.25; cursor: default; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; animation: overlayIn 0.25s var(--ease); }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 8px 20px 28px;
      width: 100%;
      max-width: 480px;
      max-height: 85dvh;
      overflow-y: auto;
      animation: slideUp 0.3s var(--ease);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border-strong);
      border-radius: 99px;
      margin: 0 auto 16px;
    }
    .modal h3 { font-size: 1.0625rem; font-weight: 700; margin-bottom: 18px; letter-spacing: -0.02em; }
    .form-group { margin-bottom: 16px; }
    .form-group > label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 6px;
    }
    .alt-list { list-style: none; }
    .alt-list li {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 0.9375rem;
      font-weight: 500;
      transition: all 0.15s var(--ease);
    }
    .alt-list li:active { transform: scale(0.98); border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .chart-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .chart-tab {
      flex: 1;
      padding: 9px 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 0.6875rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s var(--ease);
    }
    .chart-tab.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .chart-svg { width: 100%; height: auto; display: block; }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.375rem;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .stat-label { font-size: 0.6875rem; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }
    .toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(24px);
      background: var(--surface);
      color: var(--text);
      padding: 12px 22px;
      border-radius: 99px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow);
      z-index: 300;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease), visibility 0.3s;
    }
    .toast.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .plan-day-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .plan-day-header .plan-day-title { margin-bottom: 0; flex: 1; }
    .plan-day-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 0.9375rem;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
    }
    .config-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .config-section h3 {
      font-size: 0.6875rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 14px 0 4px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9375rem;
      font-weight: 500;
    }
    .config-section .toggle-row:last-child { border-bottom: none; }
    .config-section .btn-group { padding: 12px 0 16px; margin-top: 0; }
    .toggle {
      width: 50px;
      height: 30px;
      background: var(--surface2);
      border-radius: 99px;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: background 0.25s var(--ease);
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.25s var(--ease);
    }
    .toggle.on::after { transform: translateX(20px); }
    .about-text {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      padding: 8px 0 16px;
      line-height: 1.6;
    }
    .saved-indicator {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--success);
      text-align: center;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }
    .saved-indicator.show { opacity: 1; }
    .save-wrap { margin-top: 16px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="screen-hoje" class="screen active"></div>
    <div id="screen-plano" class="screen"></div>
    <div id="screen-evolucao" class="screen"></div>
    <div id="screen-config" class="screen"></div>
  </div>

  <nav id="nav" aria-label="Navegação principal">
    <button data-tab="hoje" class="active" aria-label="Hoje">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Hoje
    </button>
    <button data-tab="plano" aria-label="Plano">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Plano
    </button>
    <button data-tab="evolucao" aria-label="Evolução">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Evolução
    </button>
    <button data-tab="config" aria-label="Configurações">

let state = {
  plan: null,
  logs: {},
  cfg: { theme: 'dark', unit: 'kg', lastWorkoutId: null },
  activeTab: 'hoje',
  selectedWorkout: 'push',
  chartMetric: 'maxKg',
  chartExercise: null,
  draftSets: {}
};

function getRotation() {
  return (state.plan?.days || []).map(d => d.id);
}

function nextWorkoutId(lastId) {
  const rotation = getRotation();
  if (!rotation.length) return null;
  if (!lastId) return rotation[0];
  const idx = rotation.indexOf(lastId);
  if (idx < 0) return rotation[0];
  return rotation[(idx + 1) % rotation.length];
}

function shortWorkoutName(day) {
  if (!day) return '';
  if (day.short) return day.short;
  return (day.name || '').split(' ')[0] || day.name;
}

function loadState() {
  const savedPlan = localStorage.getItem(KEYS.plan);
  state.plan = savedPlan ? JSON.parse(savedPlan) : structuredClone(DEFAULT_PLAN);
  const savedLogs = localStorage.getItem(KEYS.logs);
  state.logs = savedLogs ? JSON.parse(savedLogs) : {};
  const savedCfg = localStorage.getItem(KEYS.cfg);
  if (savedCfg) state.cfg = { ...state.cfg, ...JSON.parse(savedCfg) };
  state.selectedWorkout = nextWorkoutId(state.cfg.lastWorkoutId);
  if (!getWorkoutPlan(state.selectedWorkout) && state.plan.days.length) {
    state.selectedWorkout = state.plan.days[0].id;
  }
  document.documentElement.setAttribute('data-theme', state.cfg.theme);
}

function savePlan() { localStorage.setItem(KEYS.plan, JSON.stringify(state.plan)); }
function saveLogs() { localStorage.setItem(KEYS.logs, JSON.stringify(state.logs)); }
function saveCfg() {
  localStorage.setItem(KEYS.cfg, JSON.stringify(state.cfg));
  document.documentElement.setAttribute('data-theme', state.cfg.theme);
}

function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  if (toastTimer) clearTimeout(toastTimer);
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    toastTimer = null;
  }, 2200);
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return d + '/' + m + '/' + y.slice(2);
}

function epley1RM(kg, reps) {
  if (!kg || !reps) return 0;
  return kg * (1 + reps / 30);
}

function getWorkoutPlan(workoutId) {
  return state.plan.days.find(d => d.id === workoutId) || null;
}

function getLastSession(exerciseId) {
  const sessions = state.logs[exerciseId];
  if (!sessions || !sessions.length) return null;
  return sessions[sessions.length - 1];
}

function formatLastSession(session, bodyweight) {
  if (!session || !session.sets.length) return 'Sem histórico';
  const best = session.sets.reduce((a, s) => {
    const val = bodyweight ? s.reps : (s.kg || 0);
    const bestVal = bodyweight ? a.reps : (a.kg || 0);
    return val > bestVal ? s : a;
  }, session.sets[0]);
  if (bodyweight) return 'Última: ' + best.reps + ' reps (' + formatDate(session.date) + ')';
  return 'Última: ' + (best.kg || 0) + state.cfg.unit + ' × ' + best.reps + ' (' + formatDate(session.date) + ')';
}

function getDraftKey(dayId, exId) { return dayId + '::' + exId; }

function initDraftForDay(day) {
  if (!day) return;
  const date = todayISO();
  day.exercises.forEach(ex => {
    const key = getDraftKey(day.id, ex.id);
    if (state.draftSets[key]) return;
    const todayLog = (state.logs[ex.id] || []).find(s => s.date === date);
    if (todayLog) {
      state.draftSets[key] = todayLog.sets.map(s => ({ ...s }));
    } else {
      const last = getLastSession(ex.id);
      state.draftSets[key] = Array.from({ length: ex.sets }, (_, i) => {
        const prev = last?.sets[i];
        return { reps: '', kg: ex.bodyweight ? '' : (prev?.kg ?? '') };
      });
    }
  });
}

function renderHoje() {
  const el = document.getElementById('screen-hoje');
  const dayPlan = getWorkoutPlan(state.selectedWorkout);

  const chips = getRotation().map(id => {
    const dp = getWorkoutPlan(id);
    const label = shortWorkoutName(dp);
    return '<button class="day-chip' + (id === state.selectedWorkout ? ' active' : '') + '" data-workout="' + id + '">' + esc(label) + '</button>';
  }).join('');

  let content = '';
  if (!dayPlan) {
    content = '<div class="empty-state">Nenhum plano cadastrado. Crie um na aba Plano.</div>';
  } else {
    initDraftForDay(dayPlan);
    content = dayPlan.exercises.map(ex => {
      const key = getDraftKey(dayPlan.id, ex.id);
      const draft = state.draftSets[key] || [];
      const lastStr = formatLastSession(getLastSession(ex.id), ex.bodyweight);
      const rowClass = ex.bodyweight ? 'set-row set-row--bw' : 'set-row';
      const setsHtml = draft.map((s, i) => {
        const kgInput = ex.bodyweight ? '' :
          '<div class="field"><label>Carga (' + state.cfg.unit + ')</label><input type="number" inputmode="decimal" step="0.5" min="0" data-key="' + key + '" data-set="' + i + '" data-field="kg" value="' + (s.kg !== '' && s.kg !== undefined ? s.kg : '') + '" placeholder="0"></div>';
        return '<div class="' + rowClass + '"><span class="set-num">' + (i + 1) + '</span>' +
          kgInput +
          '<div class="field"><label>Reps</label><input type="number" inputmode="numeric" min="0" data-key="' + key + '" data-set="' + i + '" data-field="reps" value="' + (s.reps !== '' && s.reps !== undefined ? s.reps : '') + '" placeholder="0"></div></div>';
      }).join('');
      return '<div class="card" data-exercise="' + ex.id + '">' +
        '<div class="card-header"><span class="card-title">' + esc(ex.name) + '</span><span class="badge accent">' + ex.sets + '×' + ex.reps + '</span></div>' +
        '<div class="last-session">' + ICON_HISTORY + ' ' + lastStr + '</div>' +
        '<div class="sets-grid">' + setsHtml + '</div></div>';
    }).join('');
    content += '<div class="save-wrap"><button class="btn btn-primary btn-block" id="save-session">Salvar sessão</button>' +
      '<div class="saved-indicator" id="saved-indicator">Sessão salva</div></div>';
  }

  const dateStr = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  el.innerHTML = pageHeader('Hoje', dateStr, dayPlan ? dayPlan.name : null) +
    '<div class="day-picker-wrap"><div class="day-picker">' + chips + '</div></div>' + content;
}

function renderPlano() {
  const el = document.getElementById('screen-plano');
  let html = pageHeader('Plano', 'Edite treinos, exercícios, séries e repetições');

  state.plan.days.forEach((day, dayIdx) => {

      '<button class="icon-btn" data-action="plan-down" data-day="' + day.id + '" ' + (dayIdx === state.plan.days.length - 1 ? 'disabled' : '') + ' title="Descer plano">↓</button>' +
      '<button class="icon-btn" data-action="plan-edit" data-day="' + day.id + '" title="Editar plano">✎</button>' +
      '<button class="icon-btn" data-action="plan-del" data-day="' + day.id + '" title="Remover plano">×</button>' +
      '</div></div>';
    html += '<div class="plan-day-meta">' + day.exercises.length + ' exercícios · ordem ' + (dayIdx + 1) + '</div>';

      html += '<div class="exercise-item" data-day="' + day.id + '" data-ex="' + ex.id + '">' +
        '<div class="exercise-info"><div class="exercise-name">' + esc(ex.name) + '</div>' +
        '<div class="exercise-meta">' + ex.sets + ' séries · ' + ex.reps + ' reps' +
        (ex.alternatives?.length ? ' · ' + ex.alternatives.length + ' alternativas' : '') + '</div></div>' +
        '<div class="exercise-actions">' +
        '<button class="icon-btn" data-action="up" data-day="' + day.id + '" data-ex="' + ex.id + '" ' + (idx === 0 ? 'disabled' : '') + ' title="Subir">↑</button>' +
        '<button class="icon-btn" data-action="down" data-day="' + day.id + '" data-ex="' + ex.id + '" ' + (idx === day.exercises.length - 1 ? 'disabled' : '') + ' title="Descer">↓</button>' +
        '<button class="icon-btn" data-action="alt" data-day="' + day.id + '" data-ex="' + ex.id + '" title="Alternativas">↔</button>' +
        '<button class="icon-btn" data-action="edit" data-day="' + day.id + '" data-ex="' + ex.id + '" title="Editar">✎</button>' +
        '<button class="icon-btn" data-action="del" data-day="' + day.id + '" data-ex="' + ex.id + '" title="Remover">×</button>' +
        '</div></div>';
    });

function getAllExercises() {
  const list = [];
  state.plan.days.forEach(day => {
    day.exercises.forEach(ex => {
      list.push({ ...ex, dayName: day.name });
    });
  });
  return list;
}

function getExerciseById(exerciseId) {
  for (const day of state.plan.days) {
    const ex = day.exercises.find(e => e.id === exerciseId);
    if (ex) return ex;
  }
  return null;
}

function getMetricsForExercise(exerciseId) {
  const ex = getExerciseById(exerciseId);
  return ex?.bodyweight ? ['maxReps', 'totalReps'] : ['maxKg', 'e1rm', 'volume'];
}

function getMetricLabels(exerciseId) {
  const unit = state.cfg.unit;
  const ex = getExerciseById(exerciseId);
  if (ex?.bodyweight) {
    return { maxReps: 'Reps máx.', totalReps: 'Reps totais' };
  }
  return {
    maxKg: 'Carga máx. (' + unit + ')',
    e1rm: 'e1RM (' + unit + ')',
    volume: 'Volume (' + unit + ')'
  };
}

function getExerciseStats(exerciseId) {
  const sessions = state.logs[exerciseId] || [];
  if (!sessions.length) return null;
  const ex = getExerciseById(exerciseId);
  const last = sessions[sessions.length - 1];

  if (ex?.bodyweight) {
    let bestReps = 0, bestTotalReps = 0;
    sessions.forEach(s => {
      let maxReps = 0, totalReps = 0;
      s.sets.forEach(set => {
        maxReps = Math.max(maxReps, set.reps || 0);
        totalReps += set.reps || 0;
      });
      if (maxReps > bestReps) bestReps = maxReps;
      if (totalReps > bestTotalReps) bestTotalReps = totalReps;
    });
    return { bodyweight: true, bestReps, bestTotalReps, lastDate: last.date, sessionCount: sessions.length };
  }

  let bestKg = 0, bestE1RM = 0, bestVol = 0;
  sessions.forEach(s => {
    let maxKg = 0, vol = 0, maxE1 = 0;
    s.sets.forEach(set => {
      if (set.kg > maxKg) maxKg = set.kg;
      vol += (set.kg || 0) * (set.reps || 0);
      const e1 = epley1RM(set.kg, set.reps);
      if (e1 > maxE1) maxE1 = e1;
    });
    if (maxKg > bestKg) bestKg = maxKg;
    if (maxE1 > bestE1RM) bestE1RM = maxE1;
    if (vol > bestVol) bestVol = vol;
  });
  return { bodyweight: false, bestKg, bestE1RM, bestVol, lastDate: last.date, sessionCount: sessions.length };
}

function getChartData(exerciseId, metric) {
  const sessions = (state.logs[exerciseId] || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  return sessions.map(s => {
    let val = 0;
    s.sets.forEach(set => {
      if (metric === 'maxKg') val = Math.max(val, set.kg || 0);
      else if (metric === 'e1rm') val = Math.max(val, epley1RM(set.kg, set.reps));
      else if (metric === 'volume') val += (set.kg || 0) * (set.reps || 0);
      else if (metric === 'maxReps') val = Math.max(val, set.reps || 0);
      else if (metric === 'totalReps') val += set.reps || 0;
    });
    return { date: s.date, value: Math.round(val * 10) / 10 };
  });
}

function renderChartSVG(data, unit) {
  if (!data.length) return '<div class="empty-state">Sem dados ainda. Registre treinos na aba Hoje.</div>';
  const W = 340, H = 180, pad = { t: 16, r: 12, b: 28, l: 40 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const vals = data.map(d => d.value);
  let minV, maxV;
  if (data.length === 1) {
    minV = 0;
    maxV = Math.max(vals[0] * 1.2, 1);
  } else {
    minV = Math.min(...vals);
    maxV = Math.max(...vals);
  }
  const range = maxV - minV || 1;
  const pts = data.map((d, i) => {
    const x = pad.l + (data.length === 1 ? cw / 2 : (i / (data.length - 1)) * cw);
    const y = pad.t + ch - ((d.value - minV) / range) * ch;
    return { x, y, ...d };
  });
  const polyline = pts.map(p => p.x + ',' + p.y).join(' ');
  const area = pad.l + ',' + (pad.t + ch) + ' ' + polyline + ' ' + (pad.l + cw) + ',' + (pad.t + ch);
  let labels = '';
  const step = Math.max(1, Math.floor(data.length / 5));
  data.forEach((d, i) => {
    if (i % step === 0 || i === data.length - 1) {
      const x = pad.l + (data.length === 1 ? cw / 2 : (i / (data.length - 1)) * cw);
      labels += '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle" fill="#9aa3b5" font-size="9" font-family="Plus Jakarta Sans,sans-serif">' + formatDate(d.date) + '</text>';
    }
  });
  const yLabels = [minV, minV + range / 2, maxV].map((v, i) => {
    const y = pad.t + ch - (i / 2) * ch;
    return '<text x="' + (pad.l - 6) + '" y="' + (y + 4) + '" text-anchor="end" fill="#9aa3b5" font-size="9" font-family="JetBrains Mono,monospace">' + Math.round(v) + '</text>';
  }).join('');
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="' + pad.l + '" y1="' + pad.t + '" x2="' + pad.l + '" y2="' + (pad.t + ch) + '" stroke="var(--border)" stroke-width="1"/>' +
    '<line x1="' + pad.l + '" y1="' + (pad.t + ch) + '" x2="' + (pad.l + cw) + '" y2="' + (pad.t + ch) + '" stroke="var(--border)" stroke-width="1"/>' +
    yLabels + labels +
    '<polygon points="' + area + '" fill="rgba(52,211,153,0.08)"/>' +
    '<polyline points="' + polyline + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    pts.map(p => '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="var(--accent)"/>').join('') +
    '</svg>';
}

function renderEvolucao() {
  const el = document.getElementById('screen-evolucao');
  const exercises = getAllExercises();
  const hasLogs = exercises.some(ex => (state.logs[ex.id] || []).length > 0);

  if (!exercises.length) {
    el.innerHTML = pageHeader('Evolução') + '<div class="empty-state">Nenhum exercício no plano.</div>';
    return;
  }

  if (!state.chartExercise) {
    const firstWithData = exercises.find(ex => (state.logs[ex.id] || []).length > 0);
    state.chartExercise = firstWithData?.id || exercises[0].id;
  }

  const availableMetrics = getMetricsForExercise(state.chartExercise);
  if (!availableMetrics.includes(state.chartMetric)) {
    state.chartMetric = availableMetrics[0];
  }

  const stats = getExerciseStats(state.chartExercise);
  const data = getChartData(state.chartExercise, state.chartMetric);
  const metricLabels = getMetricLabels(state.chartExercise);

  let options = exercises.map(ex => {
    const count = (state.logs[ex.id] || []).length;
    return '<option value="' + ex.id + '"' + (ex.id === state.chartExercise ? ' selected' : '') + '>' + esc(ex.name) + (count ? ' (' + count + ')' : '') + '</option>';
  }).join('');

  let statsHtml = '';
  if (stats) {
    if (stats.bodyweight) {
      statsHtml = '<div class="stats-row">' +
        '<div class="stat-box"><div class="stat-value">' + stats.bestReps + '</div><div class="stat-label">Melhor reps (série)</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + stats.bestTotalReps + '</div><div class="stat-label">Melhor total</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + stats.sessionCount + '</div><div class="stat-label">Sessões</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + formatDate(stats.lastDate) + '</div><div class="stat-label">Último treino</div></div></div>';
    } else {
      statsHtml = '<div class="stats-row">' +
        '<div class="stat-box"><div class="stat-value">' + stats.bestKg + state.cfg.unit + '</div><div class="stat-label">Melhor carga</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + Math.round(stats.bestE1RM) + state.cfg.unit + '</div><div class="stat-label">Melhor e1RM</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + stats.sessionCount + '</div><div class="stat-label">Sessões</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + formatDate(stats.lastDate) + '</div><div class="stat-label">Último treino</div></div></div>';
    }
  }

  const tabs = availableMetrics.map(m =>
    '<button class="chart-tab' + (state.chartMetric === m ? ' active' : '') + '" data-metric="' + m + '">' + metricLabels[m] + '</button>'
  ).join('');

    el.innerHTML = pageHeader('Evolução', 'Acompanhe seu progresso ao longo do tempo') +
    '<div class="form-group"><label>Exercício</label><select id="chart-exercise-select">' + options + '</select></div>' +
    statsHtml +
    '<div class="chart-container"><div class="chart-tabs">' + tabs + '</div>' +
    renderChartSVG(data, state.cfg.unit) + '</div>' +
    (!hasLogs ? '<div class="empty-state">Registre seu primeiro treino na aba Hoje para ver os gráficos.</div>' : '');
}

function renderConfig() {
  const el = document.getElementById('screen-config');
  el.innerHTML = pageHeader('Configurações', 'Preferências e backup dos dados') +
    '<div class="config-section"><h3>Aparência</h3>' +
    '<div class="toggle-row"><span>Tema claro</span><div class="toggle' + (state.cfg.theme === 'light' ? ' on' : '') + '" id="toggle-theme" role="switch" aria-checked="' + (state.cfg.theme === 'light') + '"></div></div></div>' +
    '<div class="config-section"><h3>Dados</h3>' +
    '<div class="btn-group"><button class="btn btn-secondary btn-block" id="export-backup">Exportar backup</button></div>' +
    '<div class="btn-group"><button class="btn btn-secondary btn-block" id="import-backup">Importar backup</button></div>' +
    '<div class="btn-group"><button class="btn btn-danger btn-block" id="reset-data">Resetar dados</button></div></div>' +
    '<div class="config-section"><h3>Sobre</h3>' +
    '<p class="about-text">Treino Tracker · Plano PPL/UL · Dados salvos localmente no seu dispositivo.</p></div>';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function render() {
  renderHoje();
  renderPlano();
  renderEvolucao();
  renderConfig();
}

function openModal(html) {
  document.getElementById('modal-content').innerHTML = '<div class="modal-handle"></div>' + html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveSession() {
  const dayPlan = getWorkoutPlan(state.selectedWorkout);
  if (!dayPlan) return;
  const date = todayISO();
  let saved = 0;
  dayPlan.exercises.forEach(ex => {
    const key = getDraftKey(dayPlan.id, ex.id);
    const draft = state.draftSets[key];
    if (!draft) return;
    const sets = draft
      .filter(s => s.reps !== '' && s.reps !== undefined && Number(s.reps) > 0)
      .map(s => ({ reps: Number(s.reps), kg: ex.bodyweight ? undefined : Number(s.kg || 0) }));
    if (!sets.length) return;
    if (!state.logs[ex.id]) state.logs[ex.id] = [];
    const idx = state.logs[ex.id].findIndex(s => s.date === date);
    const entry = { date, sets };
    if (idx >= 0) state.logs[ex.id][idx] = entry;
    else state.logs[ex.id].push(entry);
    saved++;
  });
  if (saved > 0) {
    state.cfg.lastWorkoutId = dayPlan.id;
    saveCfg();
  }
  saveLogs();
  const indicator = document.getElementById('saved-indicator');
  if (indicator) {
    indicator.classList.add('show');
    setTimeout(() => indicator.classList.remove('show'), 2000);
  }
  toast(saved ? 'Sessão salva (' + saved + ' exercícios)' : 'Nenhum dado para salvar');
  renderEvolucao();
}

function showEditExercise(dayId, exId) {
  const day = state.plan.days.find(d => d.id === dayId);
  const ex = day?.exercises.find(e => e.id === exId);
  if (!ex) return;
  openModal('<h3>Editar exercício</h3>' +
    '<div class="form-group"><label>Nome</label><input id="edit-name" value="' + escAttr(ex.name) + '"></div>' +
    '<div class="form-group"><label>Séries</label><input type="number" id="edit-sets" min="1" max="10" value="' + ex.sets + '"></div>' +
    '<div class="form-group"><label>Repetições (ex: 8-12)</label><input id="edit-reps" value="' + escAttr(ex.reps) + '"></div>' +
    '<div class="form-group"><label>Alternativas (uma por linha)</label><textarea id="edit-alts" rows="4">' + esc((ex.alternatives || []).join('\n')) + '</textarea></div>' +
    '<div class="btn-group"><button class="btn btn-primary" id="edit-save">Salvar</button><button class="btn btn-secondary" id="edit-cancel">Cancelar</button></div>');
  document.getElementById('edit-save').onclick = () => {
    ex.name = document.getElementById('edit-name').value.trim() || ex.name;
    ex.sets = Math.max(1, parseInt(document.getElementById('edit-sets').value) || ex.sets);
    ex.reps = document.getElementById('edit-reps').value.trim() || ex.reps;
    ex.alternatives = document.getElementById('edit-alts').value.split('\n').map(s => s.trim()).filter(Boolean);
    savePlan();
    closeModal();
    render();
    toast('Exercício atualizado');
  };
  document.getElementById('edit-cancel').onclick = closeModal;
}

function showAlternatives(dayId, exId) {
  const day = state.plan.days.find(d => d.id === dayId);
  const ex = day?.exercises.find(e => e.id === exId);
  if (!ex || !ex.alternatives?.length) {
    toast('Sem alternativas cadastradas');
    return;
  }
  openModal('<h3>Substituir por alternativa</h3><p class="subtitle" style="margin-bottom:14px">Atual: ' + esc(ex.name) + '</p>' +
    '<ul class="alt-list">' + ex.alternatives.map(alt =>
      '<li data-alt="' + escAttr(alt) + '">' + esc(alt) + '</li>'
    ).join('') + '</ul>' +
    '<button class="btn btn-secondary btn-block" id="alt-cancel" style="margin-top:12px">Cancelar</button>');
  document.querySelectorAll('.alt-list li').forEach(li => {
    li.onclick = () => {
      ex.name = li.dataset.alt;
      savePlan();
      closeModal();
      render();
      toast('Exercício substituído');
    };
  });
  document.getElementById('alt-cancel').onclick = closeModal;
}

function showAddExercise(dayId) {
  openModal('<h3>Adicionar exercício</h3>' +
    '<div class="form-group"><label>Nome</label><input id="add-name" placeholder="Nome do exercício"></div>' +
    '<div class="form-group"><label>Séries</label><input type="number" id="add-sets" min="1" value="3"></div>' +
    '<div class="form-group"><label>Repetições</label><input id="add-reps" value="8-12"></div>' +
    '<div class="btn-group"><button class="btn btn-primary" id="add-save">Adicionar</button><button class="btn btn-secondary" id="add-cancel">Cancelar</button></div>');
  document.getElementById('add-save').onclick = () => {
    const name = document.getElementById('add-name').value.trim();
    if (!name) { toast('Informe o nome'); return; }
    const day = state.plan.days.find(d => d.id === dayId);
    const id = 'custom-' + Date.now();
    day.exercises.push({
      id,
      name,
      sets: Math.max(1, parseInt(document.getElementById('add-sets').value) || 3),
      reps: document.getElementById('add-reps').value.trim() || '8-12',
      alternatives: []
    });
    savePlan();
    closeModal();
    render();
    toast('Exercício adicionado');
  };
  document.getElementById('add-cancel').onclick = closeModal;
}

function showAddPlan() {
  openModal('<h3>Adicionar plano</h3>' +
    '<div class="form-group"><label>Nome</label><input id="plan-name" placeholder="Ex: Full Body"></div>' +
    '<div class="form-group"><label>Nome curto (opcional)</label><input id="plan-short" placeholder="Ex: Full"></div>' +
    '<div class="btn-group"><button class="btn btn-primary" id="plan-save">Criar plano</button><button class="btn btn-secondary" id="plan-cancel">Cancelar</button></div>');
  document.getElementById('plan-save').onclick = () => {
    const name = document.getElementById('plan-name').value.trim();
    if (!name) { toast('Informe o nome do plano'); return; }
    const short = document.getElementById('plan-short').value.trim() || name.split(' ')[0];
    const id = 'plan-' + Date.now();
    state.plan.days.push({ id, name, short, exercises: [] });
    savePlan();
    if (!state.selectedWorkout) state.selectedWorkout = id;
    closeModal();
    render();
    toast('Plano criado');
  };
  document.getElementById('plan-cancel').onclick = closeModal;
}

function showEditPlan(dayId) {
  const day = state.plan.days.find(d => d.id === dayId);
  if (!day) return;
  openModal('<h3>Editar plano</h3>' +
    '<div class="form-group"><label>Nome</label><input id="plan-name" value="' + escAttr(day.name) + '"></div>' +
    '<div class="form-group"><label>Nome curto</label><input id="plan-short" value="' + escAttr(day.short || shortWorkoutName(day)) + '"></div>' +
    '<div class="btn-group"><button class="btn btn-primary" id="plan-save">Salvar</button><button class="btn btn-secondary" id="plan-cancel">Cancelar</button></div>');
  document.getElementById('plan-save').onclick = () => {
    day.name = document.getElementById('plan-name').value.trim() || day.name;
    day.short = document.getElementById('plan-short').value.trim() || day.name.split(' ')[0];
    savePlan();
    closeModal();
    render();
    toast('Plano atualizado');
  };
  document.getElementById('plan-cancel').onclick = closeModal;
}

function movePlan(dayId, dir) {
  const idx = state.plan.days.findIndex(d => d.id === dayId);
  const newIdx = idx + dir;
  if (idx < 0 || newIdx < 0 || newIdx >= state.plan.days.length) return;
  const tmp = state.plan.days[idx];
  state.plan.days[idx] = state.plan.days[newIdx];
  state.plan.days[newIdx] = tmp;
  savePlan();
  render();
}

function deletePlan(dayId) {
  if (state.plan.days.length <= 1) {
    toast('Mantenha pelo menos 1 plano');
    return;
  }
  const day = state.plan.days.find(d => d.id === dayId);
  if (!day) return;
  if (!confirm('Remover o plano "' + day.name + '"?')) return;
  state.plan.days = state.plan.days.filter(d => d.id !== dayId);
  if (state.cfg.lastWorkoutId === dayId) {
    state.cfg.lastWorkoutId = null;
    saveCfg();
  }
  if (state.selectedWorkout === dayId) {
    state.selectedWorkout = nextWorkoutId(state.cfg.lastWorkoutId);
  }
  savePlan();
  render();
  toast('Plano removido');
}

function moveExercise(dayId, exId, dir) {
  const day = state.plan.days.find(d => d.id === dayId);
  const idx = day.exercises.findIndex(e => e.id === exId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= day.exercises.length) return;
  const tmp = day.exercises[idx];
  day.exercises[idx] = day.exercises[newIdx];
  day.exercises[newIdx] = tmp;
  savePlan();
  renderPlano();
}

function deleteExercise(dayId, exId) {
  if (!confirm('Remover este exercício do plano?')) return;
  const day = state.plan.days.find(d => d.id === dayId);
  day.exercises = day.exercises.filter(e => e.id !== exId);
  savePlan();
  render();
  toast('Exercício removido');
}

function exportBackup() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    plan: state.plan,
    logs: state.logs,
    cfg: state.cfg
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'treino-backup-' + todayISO() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup exportado');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.plan) { state.plan = data.plan; savePlan(); }
      if (data.logs) { state.logs = data.logs; saveLogs(); }
      if (data.cfg) { state.cfg = { ...state.cfg, ...data.cfg }; saveCfg(); }
      state.selectedWorkout = nextWorkoutId(state.cfg.lastWorkoutId);
      state.draftSets = {};
      render();
      toast('Backup importado com sucesso');
    } catch {
      toast('Arquivo inválido');
    }
  };
  reader.readAsText(file);
}

function resetData() {
  if (!confirm('Isso apaga plano, histórico e configurações. Deseja continuar?')) return;
  localStorage.removeItem(KEYS.plan);
  localStorage.removeItem(KEYS.logs);
  localStorage.removeItem(KEYS.cfg);
  state.plan = structuredClone(DEFAULT_PLAN);
  state.logs = {};
  state.cfg = { theme: 'dark', unit: 'kg', lastWorkoutId: null };
  state.selectedWorkout = 'push';
  state.draftSets = {};
  saveCfg();
  render();
  toast('Dados resetados');
}

document.getElementById('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  state.activeTab = btn.dataset.tab;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + state.activeTab).classList.add('active');
});

document.getElementById('app').addEventListener('input', (e) => {
  const inp = e.target;
  if (!inp.dataset.key) return;
  const key = inp.dataset.key;
  const setIdx = parseInt(inp.dataset.set);
  const field = inp.dataset.field;
  if (!state.draftSets[key]) state.draftSets[key] = [];
  if (!state.draftSets[key][setIdx]) state.draftSets[key][setIdx] = { reps: '', kg: '' };
  state.draftSets[key][setIdx][field] = inp.value;
});

document.getElementById('app').addEventListener('click', (e) => {
  const chip = e.target.closest('.day-chip');
  if (chip) {
    state.selectedWorkout = chip.dataset.workout;
    renderHoje();
    return;
  }
  if (e.target.id === 'save-session') { saveSession(); return; }

  const chartTab = e.target.closest('.chart-tab');
  if (chartTab) {
    state.chartMetric = chartTab.dataset.metric;
    renderEvolucao();
    return;
  }
});

document.getElementById('screen-plano').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, day, ex } = btn.dataset;
  if (action === 'edit') showEditExercise(day, ex);
  else if (action === 'alt') showAlternatives(day, ex);
  else if (action === 'add') showAddExercise(day);
  else if (action === 'del') deleteExercise(day, ex);
  else if (action === 'up') moveExercise(day, ex, -1);
  else if (action === 'down') moveExercise(day, ex, 1);
  else if (action === 'plan-add') showAddPlan();
  else if (action === 'plan-edit') showEditPlan(day);
  else if (action === 'plan-del') deletePlan(day);
  else if (action === 'plan-up') movePlan(day, -1);
  else if (action === 'plan-down') movePlan(day, 1);
});

document.getElementById('screen-evolucao').addEventListener('change', (e) => {
  if (e.target.id === 'chart-exercise-select') {
    state.chartExercise = e.target.value;
    const metrics = getMetricsForExercise(state.chartExercise);
    if (!metrics.includes(state.chartMetric)) {
      state.chartMetric = metrics[0];
    }
    renderEvolucao();
  }
});

document.getElementById('screen-config').addEventListener('click', (e) => {
  if (e.target.id === 'toggle-theme') {
    state.cfg.theme = state.cfg.theme === 'dark' ? 'light' : 'dark';
    saveCfg();
    renderConfig();
  }
  if (e.target.id === 'export-backup') exportBackup();
  if (e.target.id === 'import-backup') document.getElementById('import-file').click();
  if (e.target.id === 'reset-data') resetData();
});

document.getElementById('import-file').addEventListener('change', (e) => {
  if (e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

loadState();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
